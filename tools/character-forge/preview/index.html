<!doctype html>
<html><head><meta charset="utf-8"><title>Forge preview</title>
<style>body{margin:0;background:#4a6fa8}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/apps/web/node_modules/three/build/three.module.js","three/addons/":"/apps/web/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const units = new URLSearchParams(location.search).get('u').split(',');
const anim = new URLSearchParams(location.search).get('a') || 'Idle';
const cols = Math.min(units.length, 5), rows = Math.ceil(units.length / cols);
const W = cols * 260, H = rows * 330;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x4a6fa8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 6, 8); scene.add(sun);
const cam = new THREE.OrthographicCamera(-cols * 1.3, cols * 1.3, rows * 1.65, -rows * 1.65, 0.1, 100);
cam.position.set(0, 2, 20); cam.lookAt(0, 0, 0);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const lib = await loader.loadAsync('/apps/web/public/assets/models/anims.glb');
const clip = lib.animations.find(c => c.name === anim) || lib.animations[0];
const mixers = [];
for (let i = 0; i < units.length; i++) {
  const g = await loader.loadAsync(`/tools/character-forge/out/forged_${units[i]}.glb`);
  const m = g.scene; const cx = (i % cols) - (cols - 1) / 2, cy = Math.floor(i / cols);
  m.position.set(cx * 2.6, (rows - 1) / 2 * 3.3 - cy * 3.3 - 1.3, 0);
  m.rotation.y = 0.45;
  m.traverse(o => { if (o.isMesh && o.name === 'Team') o.material = Object.assign(o.material.clone(), { color: new THREE.Color(0x2f7fe8) }); });
  scene.add(m);
  const mx = new THREE.AnimationMixer(m); mx.clipAction(clip).play(); mx.update(0.3); mixers.push(mx);
}
r.render(scene, cam);
window.__done = true;
</script></body></html>
