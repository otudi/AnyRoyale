# Render Blueprint for AnyRoyale (one Docker web service).
# Review before applying: plan and region are suggestions; existing services are not modified.
services:
  - type: web
    name: anyroyale
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # 512 MB / 0.5 CPU; "free" also works but sleeps when idle
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SESSION_SECRET
        generateValue: true  # HMAC key for guest tokens; keep it stable across deploys
      - key: RECONNECT_GRACE_SECONDS
        value: "30"
      - key: MAX_MATCHES
        value: "100"
      - key: TICK_THREADS
        value: "2"
